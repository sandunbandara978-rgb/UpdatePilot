name: UpdatePilot CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Code Quality, Tests & Build Validation
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Generate Prisma Database Client
        run: npm run prisma:generate

      - name: Build Shared Contracts Package
        run: npm --workspace=packages/shared run build

      - name: Build Windows Desktop Agent
        run: npm --workspace=agent run build

      - name: Run Automated Test Suite
        run: npm test

      - name: Execute Production Web Build
        run: npm run build
